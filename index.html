<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#4FC3F7" />
<title>TUBUHKU HEBAT! 🧒</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Comic Sans MS','Baloo 2',system-ui,sans-serif; user-select:none; }
  body {
    background: linear-gradient(180deg,#87CEEB 0%,#B3E5FC 50%,#E1F5FE 100%);
    position:relative;
  }
  /* ===== MOBILE FRAME ===== */
  #app {
    width:100vw; height:100vh;
    max-width:480px; margin:0 auto;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* ===== AWAN BERGERAK ===== */
  .cloud {
    position:absolute; font-size:60px; opacity:.9;
    animation: floatCloud linear infinite;
    pointer-events:none; z-index:1;
  }
  @keyframes floatCloud {
    from { transform: translateX(-120vw); }
    to   { transform: translateX(120vw); }
  }
  /* ===== WEBGL CANVAS (KEMBANG API) ===== */
  #fireworks-canvas {
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:5;
  }
  /* ===== HEADER ===== */
  header {
    position:relative; z-index:10;
    padding:10px 12px 6px;
    display:flex; flex-direction:column; gap:6px;
  }
  .top-bar {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,.85);
    border-radius:20px; padding:6px 12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
  }
  .score-box {
    display:flex; align-items:center; gap:4px;
    font-size:16px; font-weight:bold; color:#F57C00;
  }
  .score-box .star { font-size:20px; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }

  .btn-sound, .btn-close {
    background:#FFEB3B; border:none; border-radius:50%;
    width:36px; height:36px; font-size:18px;
    cursor:pointer; box-shadow:0 3px 0 #F9A825;
    transition:transform .1s;
  }
  .btn-sound:active { transform:translateY(2px); box-shadow:0 1px 0 #F9A825; }
  .btn-sound.off { background:#BDBDBD; box-shadow:0 3px 0 #757575; }

  /* ===== PROGRESS BAR ===== */
  .progress-wrap {
    background:rgba(255,255,255,.85); border-radius:20px; padding:5px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
  }
  .progress-track { background:#E0E0E0; border-radius:20px; height:14px; overflow:hidden; }
  .progress-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#4CAF50,#8BC34A,#CDDC39);
    border-radius:20px; transition:width .5s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .progress-fill::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    animation:shine 1.5s infinite;
  }
  @keyframes shine { from{transform:translateX(-100%);} to{transform:translateX(100%);} }

  /* ===== KARAKTER AREA ===== */
  #character-area {
    position:relative; z-index:8;
    flex:1; display:flex; justify-content:center; align-items:center;
    padding:4px;
    min-height:0;
  }
  .character {
    position:relative;
    width:min(70vw,300px);
    height:min(52vh,340px);
    animation: idleBounce 2s ease-in-out infinite;
  }
  @keyframes idleBounce {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-10px); }
  }
  .body-part {
    position:absolute;
    display:flex; justify-content:center; align-items:center;
    font-size:clamp(28px,7vw,44px);
    cursor:pointer;
    transition:all .5s cubic-bezier(.34,1.56,.64,1);
    filter: grayscale(1) opacity(.25);
    transform:scale(.7);
    border-radius:50%;
  }
  .body-part.unlocked {
    filter:none; transform:scale(1);
    animation: pop 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    0%   { transform:scale(0); }
    60%  { transform:scale(1.3); }
    100% { transform:scale(1); }
  }
  /* Posisi bagian tubuh (persentase dari karakter) */
  #part-kepala   { top:0%;    left:50%; transform-origin:center; margin-left:-12%; width:24%; height:22%; background:rgba(255,224,178,.9); border-radius:50%; }
  #part-mata     { top:8%;    left:40%; width:8%; height:8%; }
  #part-mata2    { top:8%;    left:52%; width:8%; height:8%; }
  #part-telinga  { top:6%;    left:32%; width:8%; height:8%; }
  #part-telinga2 { top:6%;    left:60%; width:8%; height:8%; }
  #part-hidung   { top:14%;   left:46%; width:8%; height:8%; }
  #part-mulut    { top:20%;   left:45%; width:10%; height:8%; }
  #part-tangan   { top:48%;   left:8%;  width:16%; height:16%; }
  #part-tangan2  { top:48%;   left:76%; width:16%; height:16%; }
  #part-kaki     { top:80%;   left:32%; width:16%; height:16%; }
  #part-kaki2    { top:80%;   left:52%; width:16%; height:16%; }
  #part-gigi     { top:22%;   left:47%; width:6%; height:4%; }

  .body-part.unlocked:hover { transform:scale(1.15); }
  .body-part:not(.unlocked) { pointer-events:none; }

  /* ===== PERTANYAAN CARD ===== */
  #quiz-area {
    position:relative; z-index:9;
    background:rgba(255,255,255,.95);
    border-radius:24px 24px 0 0;
    padding:12px 14px 16px;
    box-shadow:0 -6px 20px rgba(0,0,0,.15);
    transition:transform .4s ease;
  }
  .question-text {
    font-size:clamp(15px,4.2vw,18px);
    font-weight:bold; color:#333;
    text-align:center; margin-bottom:10px;
    line-height:1.3;
    min-height:44px;
    display:flex; align-items:center; justify-content:center;
  }
  .options {
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .option-btn {
    background:linear-gradient(180deg,#FFF9C4,#FFE082);
    border:none; border-radius:16px;
    padding:12px 6px; font-size:clamp(14px,3.8vw,17px);
    font-weight:bold; color:#5D4037;
    cursor:pointer; font-family:inherit;
    box-shadow:0 4px 0 #F9A825;
    transition:transform .1s, box-shadow .1s;
    min-height:56px;
  }
  .option-btn:active { transform:translateY(3px); box-shadow:0 1px 0 #F9A825; }
  .option-btn.correct { background:linear-gradient(180deg,#A5D6A7,#66BB6A); color:#fff; box-shadow:0 4px 0 #2E7D32; }
  .option-btn.wrong   { background:linear-gradient(180deg,#EF9A9A,#E57373); color:#fff; box-shadow:0 4px 0 #C62828; animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* ===== WELCOME SCREEN ===== */
  #welcome {
    position:absolute; inset:0; z-index:100;
    background:linear-gradient(180deg,#4FC3F7,#29B6F6,#0288D1);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; color:#fff;
    transition:opacity .5s, transform .5s;
  }
  #welcome.hidden { opacity:0; transform:scale(1.2); pointer-events:none; }
  #welcome h1 {
    font-size:clamp(28px,8vw,42px);
    text-shadow:0 4px 0 #01579B, 0 6px 12px rgba(0,0,0,.3);
    margin-bottom:8px;
    animation:pulse 1.5s infinite;
  }
  #welcome .mascot { font-size:clamp(80px,25vw,120px); margin:6px 0; animation:idleBounce 1.4s infinite; }
  #welcome p { font-size:16px; margin-bottom:20px; opacity:.95; }
  .btn-play {
    background:linear-gradient(180deg,#FFEB3B,#FBC02D);
    border:none; border-radius:50px;
    padding:16px 44px; font-size:22px; font-weight:bold;
    color:#5D4037; cursor:pointer; font-family:inherit;
    box-shadow:0 6px 0 #F57F17, 0 8px 20px rgba(0,0,0,.3);
    transition:transform .1s;
  }
  .btn-play:active { transform:translateY(4px); box-shadow:0 2px 0 #F57F17; }

  /* ===== POPUP INFO ===== */
  #popup {
    position:absolute; inset:0; z-index:200;
    background:rgba(0,0,0,.5);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  #popup.show { display:flex; animation:fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .popup-card {
    background:#fff; border-radius:24px;
    padding:20px; max-width:340px; width:100%;
    text-align:center;
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .popup-card .emoji { font-size:56px; margin-bottom:8px; }
  .popup-card h3 { color:#F57C00; font-size:22px; margin-bottom:8px; }
  .popup-card p { color:#555; font-size:15px; line-height:1.4; margin-bottom:14px; }
  .popup-card button {
    background:linear-gradient(180deg,#4FC3F7,#0288D1);
    border:none; border-radius:50px;
    padding:12px 32px; font-size:16px; font-weight:bold;
    color:#fff; cursor:pointer; font-family:inherit;
    box-shadow:0 4px 0 #01579B;
  }
  .popup-card button:active { transform:translateY(3px); box-shadow:0 1px 0 #01579B; }

  /* ===== RESULT SCREEN ===== */
  #result {
    position:absolute; inset:0; z-index:150;
    background:linear-gradient(180deg,#FFD54F,#FFB300);
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px; text-align:center; color:#5D4037;
  }
  #result.show { display:flex; animation:fadeIn .5s; }
  #result h1 { font-size:clamp(28px,8vw,40px); margin-bottom:8px; text-shadow:0 3px 0 #fff; }
  #result .trophy { font-size:100px; animation:pulse 1s infinite; }
  #result p { font-size:18px; margin:10px 0; font-weight:bold; }
  #result .stars-line { font-size:32px; margin:6px 0; }
  #result button {
    background:linear-gradient(180deg,#4CAF50,#2E7D32);
    border:none; border-radius:50px;
    padding:14px 40px; font-size:18px; font-weight:bold;
    color:#fff; cursor:pointer; font-family:inherit;
    box-shadow:0 5px 0 #1B5E20; margin-top:16px;
  }
  #result button:active { transform:translateY(3px); box-shadow:0 2px 0 #1B5E20; }

  /* ===== CONFETTI OVERLAY ===== */
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:180; }

  /* ===== TOAST ===== */
  #toast {
    position:fixed; top:20%; left:50%; transform:translate(-50%,-20px);
    background:rgba(76,175,80,.95); color:#fff;
    padding:14px 28px; border-radius:50px;
    font-size:20px; font-weight:bold;
    box-shadow:0 6px 20px rgba(0,0,0,.3);
    opacity:0; pointer-events:none; z-index:250;
    transition:all .3s;
  }
  #toast.show { opacity:1; transform:translate(-50%,0) scale(1.05); }
  #toast.error { background:rgba(244,67,54,.95); }

  /* ===== FOOTER ===== */
  .footer-bar {
    display:flex; justify-content:space-between; gap:8px;
    padding:6px 12px 10px;
    z-index:9; position:relative;
  }
  .footer-btn {
    flex:1; padding:10px; border:none; border-radius:14px;
    font-family:inherit; font-size:14px; font-weight:bold;
    cursor:pointer; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .btn-repeat { background:linear-gradient(180deg,#FF9800,#E65100); }
  .btn-sound2 { background:linear-gradient(180deg,#9C27B0,#4A148C); }
  .footer-btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
</style>
</head>
<body>

<div id="app">
  <!-- AWAN -->
  <div class="cloud" style="top:8%;  animation-duration:40s; animation-delay:0s;">☁️</div>
  <div class="cloud" style="top:22%; animation-duration:55s; animation-delay:-15s;">☁️</div>
  <div class="cloud" style="top:38%; animation-duration:70s; animation-delay:-30s;">☁️</div>

  <!-- HEADER -->
  <header>
    <div class="top-bar">
      <div class="score-box">
        <span class="star">⭐</span>
        <span id="score">0</span>
        <span style="color:#999;">/ 8</span>
      </div>
      <button class="btn-sound" id="btn-sound" title="Suara">🔊</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress"></div>
      </div>
    </div>
  </header>

  <!-- KARAKTER -->
  <div id="character-area">
    <div class="character" id="character">
      <div class="body-part" id="part-kepala"   data-part="kepala">🧑</div>
      <div class="body-part" id="part-mata"     data-part="mata">👁️</div>
      <div class="body-part" id="part-mata2"    data-part="mata">👁️</div>
      <div class="body-part" id="part-telinga"  data-part="telinga">👂</div>
      <div class="body-part" id="part-telinga2" data-part="telinga">👂</div>
      <div class="body-part" id="part-hidung"   data-part="hidung">👃</div>
      <div class="body-part" id="part-mulut"    data-part="mulut">👄</div>
      <div class="body-part" id="part-tangan"   data-part="tangan">✋</div>
      <div class="body-part" id="part-tangan2"  data-part="tangan">🤚</div>
      <div class="body-part" id="part-kaki"     data-part="kaki">🦶</div>
      <div class="body-part" id="part-kaki2"    data-part="kaki">🦶</div>
      <div class="body-part" id="part-gigi"     data-part="gigi">🦷</div>
    </div>
  </div>

  <!-- KUIS -->
  <div id="quiz-area">
    <div class="question-text" id="question">Memuat pertanyaan...</div>
    <div class="options" id="options"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer-bar">
    <button class="footer-btn btn-repeat" id="btn-repeat">🔄 Ulangi</button>
    <button class="footer-btn btn-sound2" id="btn-sound2">🔊 Suara</button>
  </div>
</div>

<!-- WEBGL KEMBANG API -->
<canvas id="fireworks-canvas"></canvas>

<!-- WELCOME -->
<div id="welcome">
  <div class="mascot">🧒</div>
  <h1>TUBUHKU HEBAT!</h1>
  <p>Ayo kenali tubuhmu & cara merawatnya!</p>
  <button class="btn-play" id="btn-play">▶ MULAI</button>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-card">
    <div class="emoji" id="popup-emoji">👁️</div>
    <h3 id="popup-title">Mata</h3>
    <p id="popup-desc">Mata untuk melihat.</p>
    <button id="popup-close">OK 👍</button>
  </div>
</div>

<!-- RESULT -->
<div id="result">
  <div class="trophy">🏆</div>
  <h1>HOREEE!</h1>
  <p>Kamu berhasil mengenal tubuhmu!</p>
  <div class="stars-line" id="result-stars">⭐⭐⭐</div>
  <p id="result-score">Skor: 0 / 8</p>
  <button id="btn-again">🔄 Main Lagi</button>
</div>

<!-- TOAST -->
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
/* ============================================================
   🎮 TUBUHKU HEBAT! - Game Logic
   ============================================================ */

// ============ DATA PERTANYAAN ============
const QUESTIONS = [
  { q:"Bagian tubuh untuk MELIHAT?",        answer:"mata",    emoji:"👁️", label:"Mata",    care:"Mata untuk melihat. Rawat dengan tidak menatap HP terlalu lama, dan makan wortel ya!" },
  { q:"Bagian tubuh untuk MENDENGAR?",      answer:"telinga", emoji:"👂", label:"Telinga", care:"Telinga untuk mendengar. Jangan dikorek dengan benda tajam ya!" },
  { q:"Bagian tubuh untuk MENCIUM BAU?",    answer:"hidung",  emoji:"👃", label:"Hidung",  care:"Hidung untuk mencium bau. Jangan masukkan benda ke hidung!" },
  { q:"Bagian tubuh untuk BERBICARA & MAKAN?", answer:"mulut",emoji:"👄", label:"Mulut",   care:"Mulut untuk berbicara & makan. Jaga kebersihannya ya!" },
  { q:"Bagian tubuh untuk MENGGENGGAM?",    answer:"tangan",  emoji:"✋", label:"Tangan",  care:"Tangan untuk menggenggam. Cuci tangan pakai sabun sebelum makan!" },
  { q:"Bagian tubuh untuk BERJALAN?",       answer:"kaki",    emoji:"🦶", label:"Kaki",    care:"Kaki untuk berjalan. Pakai sepatu saat keluar rumah ya!" },
  { q:"Bagian tubuh paling ATAS?",          answer:"kepala",  emoji:"🧑", label:"Kepala",  care:"Kepala di paling atas. Keramas 2x seminggu agar bersih!" },
  { q:"Bagian tubuh untuk MENGUNYAH?",      answer:"gigi",    emoji:"🦷", label:"Gigi",    care:"Gigi untuk mengunyah. Sikat gigi pagi & malam ya!" }
];

// Pilihan jawaban (4 opsi acak per pertanyaan)
const CHOICES = {
  mata:    ["Mata","Kaki","Telinga","Hidung"],
  telinga: ["Telinga","Mulut","Tangan","Mata"],
  hidung:  ["Hidung","Kepala","Kaki","Gigi"],
  mulut:   ["Mulut","Mata","Telinga","Tangan"],
  tangan:  ["Tangan","Kaki","Hidung","Kepala"],
  kaki:    ["Kaki","Mata","Mulut","Gigi"],
  kepala:  ["Kepala","Telinga","Tangan","Hidung"],
  gigi:    ["Gigi","Kaki","Mata","Mulut"]
};

// ============ STATE ============
let state = {
  current: 0,
  score: 0,
  unlocked: {},      // { mata:true, ... }
  soundOn: true,
  finished: false
};

const STORAGE_KEY = "tubuhku_hebat_save_v1";

// ============ SOUND (Web Audio API) ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { console.warn("AudioContext tidak didukung"); }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function playTone(freq, duration=0.15, type="sine", vol=0.15) {
  if (!state.soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function soundDing() {
  if (!state.soundOn) return;
  playTone(880, 0.15, "sine", 0.2);
  setTimeout(() => playTone(1320, 0.25, "sine", 0.2), 100);
}

function soundBuzz() {
  if (!state.soundOn) return;
  playTone(180, 0.25, "sawtooth", 0.12);
}

function soundClap() {
  if (!state.soundOn || !audioCtx) return;
  // Simulasi tepuk tangan: noise burst
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.25;
  src.connect(gain).connect(audioCtx.destination);
  src.start();
}

function soundWin() {
  if (!state.soundOn) return;
  const notes = [523, 659, 784, 1047, 1319];
  notes.forEach((f, i) => setTimeout(() => playTone(f, 0.25, "sine", 0.2), i * 130));
}

// ============ SPEECH (Web Speech API) ============
function speak(text) {
  if (!state.soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "id-ID";
  u.rate = 0.9;
  u.pitch = 1.3;
  const voices = speechSynthesis.getVoices();
  const idVoice = voices.find(v => v.lang.startsWith("id"));
  if (idVoice) u.voice = idVoice;
  speechSynthesis.speak(u);
}
// Preload suara
if ("speechSynthesis" in window) speechSynthesis.getVoices();

// ============ WEBGL KEMBANG API (Three.js) ============
let fwScene, fwCamera, fwRenderer, fwParticles = [];

function initFireworks() {
  const canvas = document.getElementById("fireworks-canvas");
  fwRenderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  fwRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  fwRenderer.setSize(window.innerWidth, window.innerHeight);

  fwScene = new THREE.Scene();
  fwCamera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  fwCamera.position.z = 50;

  animateFireworks();
  window.addEventListener("resize", () => {
    fwRenderer.setSize(window.innerWidth, window.innerHeight);
    fwCamera.aspect = window.innerWidth / window.innerHeight;
    fwCamera.updateProjectionMatrix();
  });
}

function spawnFirework(screenX, screenY, big=false) {
  // Konversi koordinat layar → koordinat 3D
  const nx = (screenX / window.innerWidth) * 2 - 1;
  const ny = -(screenY / window.innerHeight) * 2 + 1;
  const vector = new THREE.Vector3(nx, ny, 0.5);
  vector.unproject(fwCamera);

  const origin = vector.clone();
  const count = big ? 120 : 45;
  const colors = [0xFF5252, 0xFFEB3B, 0x4CAF50, 0x4FC3F7, 0xBA68C8, 0xFF80AB, 0xFFFFFF, 0xFF9800];

  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(big ? 0.55 : 0.42, 6, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: colors[Math.floor(Math.random() * colors.length)],
      transparent: true,
      opacity: 1
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(origin);

    const angle = Math.random() * Math.PI * 2;
    const speed = (big ? 0.9 : 0.6) * (0.4 + Math.random() * 0.8);
    const velocity = new THREE.Vector3(
      Math.cos(angle) * speed,
      Math.sin(angle) * speed + 0.15,
      (Math.random() - 0.5) * 0.3
    );

    fwScene.add(mesh);
    fwParticles.push({
      mesh, velocity,
      life: 1.0,
      decay: 0.012 + Math.random() * 0.012,
      gravity: -0.022
    });
  }
}

function animateFireworks() {
  requestAnimationFrame(animateFireworks);
  for (let i = fwParticles.length - 1; i >= 0; i--) {
    const p = fwParticles[i];
    p.mesh.position.x += p.velocity.x;
    p.mesh.position.y += p.velocity.y;
    p.mesh.position.z += p.velocity.z;
    p.velocity.y += p.gravity;
    p.velocity.multiplyScalar(0.985);
    p.life -= p.decay;
    p.mesh.material.opacity = Math.max(0, p.life);
    p.mesh.scale.setScalar(Math.max(0.05, p.life));
    if (p.life <= 0) {
      fwScene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      fwParticles.splice(i, 1);
    }
  }
  fwRenderer.render(fwScene, fwCamera);
}

// ============ CONFETTI 2D (canvas) ============
const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");
let confettiPieces = [];
function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeConfetti();
window.addEventListener("resize", resizeConfetti);

function spawnConfetti() {
  for (let i = 0; i < 60; i++) {
    confettiPieces.push({
      x: Math.random() * confettiCanvas.width,
      y: -20,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      size: 6 + Math.random() * 8,
      color: ["#FF5252","#FFEB3B","#4CAF50","#4FC3F7","#BA68C8","#FF9800"][Math.floor(Math.random()*6)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3
    });
  }
}
function animateConfetti() {
  requestAnimationFrame(animateConfetti);
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  for (let i = confettiPieces.length - 1; i >= 0; i--) {
    const p = confettiPieces[i];
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    p.vy += 0.08;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
    cctx.restore();
    if (p.y > confettiCanvas.height + 30) confettiPieces.splice(i, 1);
  }
}
animateConfetti();

// ============ UI HELPERS ============
function showToast(msg, error=false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = error ? "show error" : "show";
  clearTimeout(t._to);
  t._to = setTimeout(() => t.className = "", 1400);
}

function updateHUD() {
  document.getElementById("score").textContent = state.score;
  const pct = (state.current / QUESTIONS.length) * 100;
  document.getElementById("progress").style.width = pct + "%";
}

// ============ RENDER PERTANYAAN ============
function renderQuestion() {
  if (state.current >= QUESTIONS.length) {
    finishGame();
    return;
  }
  const q = QUESTIONS[state.current];
  document.getElementById("question").textContent = q.q;
  const opts = CHOICES[q.answer];
  const container = document.getElementById("options");
  container.innerHTML = "";

  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn, opt, q);
    container.appendChild(btn);
  });

  speak(q.q);
  updateHUD();
}

// ============ HANDLE JAWABAN ============
function handleAnswer(btn, choice, q) {
  const correct = choice.toLowerCase() === q.label.toLowerCase();
  if (correct) {
    btn.classList.add("correct");
    // Kunci semua tombol
    document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);

    state.score++;
    state.unlocked[q.answer] = true;

    // Munculkan bagian tubuh
    document.querySelectorAll(`[data-part="${q.answer}"]`).forEach(el => {
      el.classList.add("unlocked");
    });

    // Kembang api di posisi bagian tubuh
    setTimeout(() => {
      const el = document.querySelector(`[data-part="${q.answer}"]`);
      if (el) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        spawnFirework(cx, cy, false);
        // Tambah beberapa percikan
        setTimeout(() => spawnFirework(cx + (Math.random()-0.5)*40, cy + (Math.random()-0.5)*40), 120);
      }
    }, 100);

    soundDing();
    setTimeout(soundClap, 200);
    showToast("⭐ Hebat! +1 bintang");
    speak(`Hebat! Itu namanya ${q.label}.`);

    updateHUD();
    saveGame();

    // Lanjut pertanyaan berikutnya
    setTimeout(() => {
      state.current++;
      updateHUD();
      if (state.current >= QUESTIONS.length) {
        finishGame();
      } else {
        renderQuestion();
      }
    }, 2000);
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    soundBuzz();
    speak("Ups, coba lagi ya!");
    showToast("Ups, coba lagi ya!", true);
    setTimeout(() => btn.classList.remove("wrong"), 600);
  }
}

// ============ FINISH ============
function finishGame() {
  state.finished = true;
  document.getElementById("question").textContent = "Selesai! 🎉";
  document.getElementById("options").innerHTML = "";
  document.getElementById("progress").style.width = "100%";

  // Kembang api besar bertubi-tubi
  let bursts = 0;
  const burstInterval = setInterval(() => {
    const x = window.innerWidth * (0.2 + Math.random() * 0.6);
    const y = window.innerHeight * (0.15 + Math.random() * 0.4);
    spawnFirework(x, y, true);
    bursts++;
    if (bursts >= 6) clearInterval(burstInterval);
  }, 350);

  spawnConfetti();
  setTimeout(spawnConfetti, 800);
  setTimeout(spawnConfetti, 1600);

  soundWin();
  speak("Horeee! Kamu berhasil mengenal tubuhmu!");

  // Tampilkan result screen setelah 2 detik
  setTimeout(() => {
    document.getElementById("result-stars").textContent =
      state.score === 8 ? "⭐⭐⭐" : state.score >= 6 ? "⭐⭐" : "⭐";
    document.getElementById("result-score").textContent = `Skor: ${state.score} / 8`;
    document.getElementById("result").classList.add("show");
    saveGame();
  }, 2000);
}

// ============ POPUP INFO BAGIAN TUBUH ============
document.querySelectorAll(".body-part").forEach(el => {
  el.addEventListener("click", () => {
    if (!el.classList.contains("unlocked")) return;
    const part = el.dataset.part;
    const info = QUESTIONS.find(q => q.answer === part);
    if (!info) return;
    document.getElementById("popup-emoji").textContent = info.emoji;
    document.getElementById("popup-title").textContent = info.label;
    document.getElementById("popup-desc").textContent = info.care;
    document.getElementById("popup").classList.add("show");
    speak(info.care);
    // Kembang api kecil saat diklik
    const rect = el.getBoundingClientRect();
    spawnFirework(rect.left + rect.width/2, rect.top + rect.height/2, false);
  });
});

document.getElementById("popup-close").onclick = () => {
  document.getElementById("popup").classList.remove("show");
};

// ============ JSON STORAGE ============
function saveGame() {
  const data = {
    score: state.score,
    current: state.current,
    unlocked: state.unlocked,
    finished: state.finished,
    savedAt: new Date().toISOString(),
    version: 1
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.warn("Gagal simpan:", e); }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object") return false;
    state.score = data.score || 0;
    state.current = data.current || 0;
    state.unlocked = data.unlocked || {};
    state.finished = !!data.finished;
    return true;
  } catch(e) { return false; }
}

function resetGame() {
  state = { current:0, score:0, unlocked:{}, soundOn:state.soundOn, finished:false };
  document.querySelectorAll(".body-part").forEach(el => el.classList.remove("unlocked"));
  document.getElementById("result").classList.remove("show");
  localStorage.removeItem(STORAGE_KEY);
  updateHUD();
  renderQuestion();
  speak("Ayo main lagi!");
}

// ============ SOUND TOGGLE ============
function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById("btn-sound").classList.toggle("off", !state.soundOn);
  document.getElementById("btn-sound").textContent = state.soundOn ? "🔊" : "🔇";
  document.getElementById("btn-sound2").textContent = state.soundOn ? "🔊 Suara" : "🔇 Suara";
  if (!state.soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
  if (state.soundOn) speak("Suara aktif");
}
document.getElementById("btn-sound").onclick = toggleSound;
document.getElementById("btn-sound2").onclick = toggleSound;

// ============ BUTTONS ============
document.getElementById("btn-repeat").onclick = () => {
  if (confirm("Ulangi permainan dari awal?")) resetGame();
};
document.getElementById("btn-again").onclick = () => {
  document.getElementById("result").classList.remove("show");
  resetGame();
};

// ============ START ============
document.getElementById("btn-play").onclick = () => {
  initAudio();
  document.getElementById("welcome").classList.add("hidden");
  // Cek save lama
  const hasSave = loadGame();
  if (hasSave && !state.finished && state.current > 0) {
    // Pulihkan bagian tubuh yang sudah terbuka
    Object.keys(state.unlocked).forEach(p => {
      document.querySelectorAll(`[data-part="${p}"]`).forEach(el => el.classList.add("unlocked"));
    });
    updateHUD();
    if (state.current >= QUESTIONS.length) {
      renderQuestion(); // akan memicu finishGame
    } else {
      renderQuestion();
    }
    speak("Halo lagi! Lanjutkan ya!");
  } else {
    resetGame();
    speak("Halo teman! Ayo kenali tubuhmu!");
  }
};

// ============ INIT ============
window.addEventListener("load", () => {
  initFireworks();
  updateHUD();
  // Sapa user sekali (belum mulai)
  setTimeout(() => {
    if (state.soundOn) speak("Selamat datang di Tubuhku Hebat!");
  }, 600);
});

// Jaga agar audio context hidup saat interaksi pertama
document.addEventListener("touchstart", initAudio, { once:true });
document.addEventListener("click", initAudio, { once:true });
</script>
